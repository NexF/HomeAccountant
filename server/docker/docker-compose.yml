services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data:/app/data
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - DEBUG=false
      - INVITE_CODE=ggb666
      - ADMIN_PASSWORD=gbb2026
    restart: unless-stopped
